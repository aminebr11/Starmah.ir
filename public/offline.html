<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>آفلاین — ستاره ماه</title>
<style>
  :root { color-scheme: dark; }
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;
    font-family:Vazirmatn,Tahoma,system-ui,sans-serif;
    background:linear-gradient(180deg,#070f24,#0a1836);color:#eaf1ff;text-align:center}
  .box{max-width:380px}
  .em{font-size:64px;margin-bottom:14px}
  h1{font-size:20px;margin:0 0 10px}
  p{color:#c6d5f5;line-height:2;font-size:14px;margin:0 0 22px}
  button{min-height:48px;padding:0 26px;border:0;border-radius:16px;cursor:pointer;
    font-family:inherit;font-weight:800;font-size:15px;color:#3a2700;
    background:linear-gradient(135deg,#ffd87a,#f5b53f)}
</style>
</head>
<body>
  <div class="box">
    <div class="em">🌙</div>
    <h1>اینترنت در دسترس نیست</h1>
    <p>
      به نظر می‌رسد دستگاهت به اینترنت وصل نیست.
      وقتی دوباره وصل شدی، ستاره ماه خودش به‌روز می‌شود.
    </p>
    <button onclick="location.reload()">تلاش دوباره</button>
  </div>
</body>
</html>
